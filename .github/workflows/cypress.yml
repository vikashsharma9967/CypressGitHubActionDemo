name: Cypress Tests

on:
  push:
    branches:
      - main
      - develop
      - VikashAutomation

  pull_request:
    branches:
      - main
      - develop
      - VikashAutomation

jobs:
  cypress-run:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run Cypress tests
      - name: Run Cypress tests
        continue-on-error: true
        run: npm test

      # 5. Generate Test Summary
      - name: Generate Test Summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const reportDir = 'cypress/reports/mochawesome';

          let total = 0;
          let passed = 0;
          let failed = 0;
          let pending = 0;

          if (fs.existsSync(reportDir)) {

            const files = fs.readdirSync(reportDir)
              .filter(file => file.endsWith('.json'));

            for (const file of files) {

              const filePath = path.join(reportDir, file);

              try {
                const report = JSON.parse(
                  fs.readFileSync(filePath, 'utf8')
                );

                if (report.stats) {
                  total += report.stats.tests || 0;
                  passed += report.stats.passes || 0;
                  failed += report.stats.failures || 0;
                  pending += report.stats.pending || 0;
                }

              } catch (error) {
                console.log(`Could not read ${file}: ${error.message}`);
              }
            }
          }

          const status = failed > 0 ? 'FAILED' : 'PASSED';

          const summary = `
          Cypress Test Execution Summary
          =================================

          Repository: ${process.env.GITHUB_REPOSITORY}
          Branch: ${process.env.GITHUB_REF_NAME}

          Total Tests: ${total}
          Passed: ${passed}
          Failed: ${failed}
          Skipped/Pending: ${pending}

          Overall Status: ${status}

          GitHub Actions Run:
          https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}

          Mochawesome Report:
          Download the "mochawesome-report" artifact from the GitHub Actions run.
          `;

          console.log(summary);

          fs.writeFileSync(
            process.env.GITHUB_WORKSPACE + '/test-summary.txt',
            summary
          );
          NODE

      # 6. Upload Mochawesome Report
      - name: Upload Mochawesome Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports/mochawesome/
          if-no-files-found: warn

      # 7. Send Email Notification
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: Cypress Test Result - ${{ job.status }}

          to: ${{ secrets.SMTP_USERNAME }}
          from: ${{ secrets.SMTP_USERNAME }}

          body: file://test-summary.txt